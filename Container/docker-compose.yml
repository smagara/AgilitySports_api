name: agilitysports-api

services:
  api:
    build:
      context: ..
      dockerfile: Container/Dockerfile
    image: ${API_IMAGE:-agilitysports-api:local}
    container_name: agilitysports-api
    ports:
      - "${HOST_API_PORT:-1106}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      Database__Mode: ${DATABASE_MODE:-Docker}
      # Value comes from Container/.env (see .env.example)
      ConnectionStrings__DockerConnectionV2: ${DOCKER_SQL_CONNECTION:?DOCKER_SQL_CONNECTION is required in Container/.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped